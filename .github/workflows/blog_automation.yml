name: Blog Automation

on:
  workflow_call:
    inputs:
      run_ai_tagging:
        type: boolean
        default: false
    secrets:
      DEEPSEEK_API_KEY:
        required: false
    outputs:
      source_sha:
        description: Commit containing the processed site sources
        value: ${{ jobs.process-blog.outputs.source_sha }}

jobs:
  process-blog:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A queued run may start after another run has updated main.
          ref: refs/heads/main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 1. Manage Blog Time Lifecycle
        env:
          POST_BASE_SHA: ${{ github.event.before }}
        run: python scripts/blog_lifecycle_manager.py

      - name: Check whether to tag articles
        id: tagging
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          RUN_AI_TAGGING: ${{ inputs.run_ai_tagging }}
        run: |
          if [[ "$RUN_AI_TAGGING" == true ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null || ! git diff --quiet "$PUSH_BEFORE" HEAD -- _posts/; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 2. AI Tagging
        if: steps.tagging.outputs.enabled == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/auto_tagger.py
          python scripts/extract_subject.py

      - name: 3. Commit processed sources
        id: publish
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Bot]"
          if [[ -d _posts ]]; then
            git add -A -- _posts/
          fi
          git add -- _data/post_serials.yml
          if ! git diff --staged --quiet; then
            git commit -m "Automated: Blog Automation (Lifecycle & AI Tags)"
            # Fail on a concurrent push. The next run processes the newer main.
            git push origin HEAD:refs/heads/main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
