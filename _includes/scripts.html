<script>
    /**
     * 更新时钟功能（仅在跨天时重算公历与农历日期）
     */
    const lunarFormatter = (() => {
        try {
            return new Intl.DateTimeFormat('zh-u-ca-chinese', { day: 'numeric', month: 'long' });
        } catch (e) {
            return null;
        }
    })();
    let lastClockDateKey = '';

    function updateClock() {
        const now = new Date();
        const timeEl = document.getElementById('clock-time');
        if (timeEl) timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });

        const dateKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
        if (dateKey !== lastClockDateKey) {
            lastClockDateKey = dateKey;
            const dateEl = document.getElementById('clock-date');
            const lunarEl = document.getElementById('clock-lunar');
            if (dateEl) dateEl.textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
            if (lunarEl && lunarFormatter) {
                try {
                    lunarEl.textContent = "农历 " + lunarFormatter.format(now);
                } catch (e) {}
            }
        }
    }
    if (document.getElementById('clock-time') || document.getElementById('clock-date')) {
        setInterval(updateClock, 1000); updateClock();
    }

    /**
     * 声优推荐
     */
    function loadAnimeExtras() {
        const cvName = document.getElementById('cv-name');
        if (cvName && window.siteData && window.siteData.cv_recommend) {
            const cv = window.siteData.cv_recommend;
            cvName.textContent = cv.name;
            document.getElementById('cv-agency').textContent = "🏢 " + cv.agency;
            document.getElementById('cv-hometown').textContent = "📍 " + cv.hometown;
            document.getElementById('cv-intro').textContent = cv.intro;
            const wikiLink = document.getElementById('cv-wiki-link');
            if (wikiLink) { wikiLink.href = "https://zh.moegirl.org.cn/" + encodeURIComponent(cv.name); }
        }
    }

    function showEmail(event, email) {
        event.stopPropagation();
        const oldTip = document.getElementById('email-tooltip');
        if (oldTip) oldTip.remove();
        
        let emailOverlay = null;
        if (window.innerWidth <= 768) {
            emailOverlay = document.createElement('div');
            emailOverlay.id = 'email-pop-overlay';
            emailOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:2147483646;backdrop-filter:blur(2px);';
        }
        
        const tip = document.createElement('div');
        tip.id = 'email-tooltip';
        tip.className = 'glass-card email-pop';
        tip.textContent = email;
        
        if (window.innerWidth <= 768) {
            tip.style.left = '50%';
            tip.style.top = '50%';
            tip.style.transform = 'translate(-50%, -50%)';
        } else {
            tip.style.left = (event.clientX + 10) + 'px';
            tip.style.top = (event.clientY + 10) + 'px';
        }
        
        const container = document.getElementById('email-pop-container') || document.body;
        if (emailOverlay) container.appendChild(emailOverlay);
        container.appendChild(tip);

        const closeTip = () => {
            tip.classList.add('fade-out');
            if (emailOverlay) {
                emailOverlay.style.opacity = '0';
                emailOverlay.style.transition = '0.3s';
            }
            setTimeout(() => {
                tip.remove();
                if (emailOverlay) emailOverlay.remove();
            }, 300);
            document.removeEventListener('click', closeTip);
        };
        setTimeout(() => document.addEventListener('click', closeTip), 10);
    }

    /**
     * 主题切换加载与控制
     */
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;
    const body = document.body;

    function applyTheme(theme) {
        const isDark = theme === 'dark';
        root.classList.toggle('dark-mode', isDark);
        body.classList.toggle('dark-mode', isDark);

        const icon = themeToggle?.querySelector('i');
        if (icon) {
            icon.classList.toggle('fa-moon', isDark);
            icon.classList.toggle('fa-sun', !isDark);
        }

        if (themeToggle) {
            themeToggle.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');
            themeToggle.setAttribute('title', isDark ? '切换到浅色模式' : '切换到深色模式');
        }
    }

    function getPreferredTheme() {
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                return savedTheme;
            }
        } catch (e) {}

        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    applyTheme(getPreferredTheme());

    if (window.matchMedia) {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        mediaQuery.addEventListener?.('change', (event) => {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem('theme');
            } catch (e) {}

            if (!savedTheme) {
                applyTheme(event.matches ? 'dark' : 'light');
            }
        });
    }

    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            const nextTheme = body.classList.contains('dark-mode') ? 'light' : 'dark';
            applyTheme(nextTheme);
            try {
                localStorage.setItem('theme', nextTheme);
            } catch (e) {}
        });
    }

    /**
     * 按需懒加载全站搜索模块（首次聚焦或打开搜索时再加载脚本与 search.json）
     */
    const sinput = document.getElementById('search-input');
    const sresults = document.getElementById('results-container');
    let searchInitialized = false;
    let searchLoadingPromise = null;

    function initSiteSearch() {
        if (searchInitialized || !sinput || !sresults) return Promise.resolve();
        if (searchLoadingPromise) return searchLoadingPromise;

        const scriptReady = typeof window.SimpleJekyllSearch === 'function'
            ? Promise.resolve()
            : new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = '{{ "/assets/vendor/simple-jekyll-search/simple-jekyll-search.min.js" | relative_url }}';
                script.async = true;
                script.onload = resolve;
                script.onerror = () => {
                    script.remove();
                    reject(new Error('Failed to load SimpleJekyllSearch'));
                };
                document.head.appendChild(script);
            });
        const indexReady = fetch('{{ "/search.json" | relative_url }}').then(response => {
            if (!response.ok) throw new Error(`Search index returned HTTP ${response.status}`);
            return response.json();
        });

        searchLoadingPromise = Promise.all([scriptReady, indexReady]).then(([, index]) => {
            if (!Array.isArray(index)) throw new Error('Invalid search index');
            const search = window.SimpleJekyllSearch({
                searchInput: sinput,
                resultsContainer: sresults,
                json: index,
                searchResultTemplate: '<li><a href="{url}"><div class="search-result-title">{title}</div><div class="search-result-meta"><i class="fas fa-calendar-alt"></i> {date}</div><div class="search-result-snippet">{content}</div></a></li>',
                noResultsText: '<li><p style="padding:15px; color:var(--text-main);">没有找到相关内容哦...</p></li>',
                limit: 8,
                templateMiddleware: function(prop, value, template) {
                    if (prop === 'content') {
                        const query = sinput.value.toLowerCase().trim();
                        if (!query) return '';
                        const contentLower = value.toLowerCase();
                        const index = contentLower.indexOf(query);
                        if (index === -1) {
                            return value.substring(0, 80) + '...';
                        }
                        const start = Math.max(0, index - 30);
                        const end = Math.min(value.length, index + query.length + 50);
                        let snippet = value.substring(start, end);
                        if (start > 0) snippet = '...' + snippet;
                        if (end < value.length) snippet = snippet + '...';

                        // 高亮关键词
                        const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                        snippet = snippet.replace(regex, '<span class="search-highlight">$1</span>');
                        return snippet;
                    }
                    return value;
                }
            });
            searchInitialized = true;
            const query = sinput.value.trim();
            sresults.style.display = query ? 'block' : 'none';
            search.search(query);
        }).catch(error => {
            console.warn('Could not initialize site search:', error);
        }).finally(() => {
            searchLoadingPromise = null;
        });
        return searchLoadingPromise;
    }

    if (sinput && sresults) {
        sinput.addEventListener('focus', initSiteSearch);
        sinput.addEventListener('input', () => {
            sresults.style.display = sinput.value ? 'block' : 'none';
            if (!searchInitialized) initSiteSearch();
        });
    }

    /**
     * 初始化页面组件
     */
    const initPageComponents = () => {
        loadAnimeExtras();
        if (typeof loadBangumiWiki === 'function') loadBangumiWiki();

        // 自动为文章内的表格添加滚动外层
        document.querySelectorAll('.post-content table').forEach(table => {
            if (table.parentNode && table.parentNode.classList.contains('table-wrapper')) return;
            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrapper';
            table.parentNode.insertBefore(wrapper, table);
            wrapper.appendChild(table);
        });

        const sidebar = document.querySelector('.sidebar');
        const sidebarOverlay = document.querySelector('.sidebar-overlay');
        const extraSidebar = document.querySelector('.extra-sidebar');
        const mobileSearchContainer = document.getElementById('mobile-search-container');
        const searchOverlay = document.getElementById('mobile-search-overlay');

        // 处理移动端适配逻辑（仅在跨越断点时移动搜索卡片）
        if (sidebar && extraSidebar && sidebarOverlay && mobileSearchContainer && searchOverlay) {
            const searchCard = document.querySelector('.search-box-card');
            const mobileMedia = window.matchMedia('(max-width: 768px)');

            const syncSearchPosition = (isMobile) => {
                if (!searchCard) return;
                if (isMobile) {
                    if (!mobileSearchContainer.contains(searchCard)) {
                        mobileSearchContainer.appendChild(searchCard);
                    }
                } else if (extraSidebar && !extraSidebar.contains(searchCard)) {
                    extraSidebar.insertBefore(searchCard, extraSidebar.firstChild);
                }
            };
            mobileMedia.addEventListener?.('change', (e) => syncSearchPosition(e.matches));
            syncSearchPosition(mobileMedia.matches);

            const setOpenSidebar = openSidebar => {
                sidebar.classList.toggle('active', openSidebar === sidebar);
                extraSidebar.classList.toggle('active', openSidebar === extraSidebar);
                sidebarOverlay.classList.toggle('active', Boolean(openSidebar));
            };

            // 侧边栏开关
            document.getElementById('mobile-menu-toggle')?.addEventListener('click', () => {
                setOpenSidebar(sidebar.classList.contains('active') ? null : sidebar);
            });

            // 右侧信息栏开关
            document.getElementById('mobile-extra-toggle')?.addEventListener('click', () => {
                setOpenSidebar(extraSidebar.classList.contains('active') ? null : extraSidebar);
            });
            sidebarOverlay.addEventListener('click', () => setOpenSidebar(null));

            // 搜索弹出层开关
            let searchCloseTimer = null;
            document.getElementById('mobile-search-toggle')?.addEventListener('click', () => {
                clearTimeout(searchCloseTimer);
                searchCloseTimer = null;
                searchOverlay.classList.add('active');
                searchOverlay.style.display = 'flex';
                initSiteSearch();
                document.getElementById('search-input')?.focus();
            });

            const closeSearch = () => {
                if (!searchOverlay.classList.contains('active')) return;
                searchOverlay.classList.remove('active');
                searchCloseTimer = setTimeout(() => {
                    searchCloseTimer = null;
                    searchOverlay.style.display = 'none';
                }, 300);
            };

            document.getElementById('close-search')?.addEventListener('click', closeSearch);
            searchOverlay.addEventListener('click', (e) => {
                if (e.target === searchOverlay) closeSearch();
            });

            // 导航点击后自动关闭菜单
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => setOpenSidebar(null));
            });
        }
    };

    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initPageComponents);
    } else {
        initPageComponents();
    }
</script>
