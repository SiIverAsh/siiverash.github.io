paper:
- desc: DeepSeek团队提出的基于强化学习的推理增强方法，通过Group Relative Policy Optimization (GRPO) 引导模型生成长链思维，在AIME、MATH-500等数学推理基准上媲美OpenAI
    o1，论文发表于ICML 2025。
  tags:
  - 推理
  - 强化学习
  - DeepSeek
  - 链式思维
  title: 'DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement
    Learning'
  url: https://arxiv.org/abs/2501.12948
tech:
