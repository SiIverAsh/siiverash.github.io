  tags:
  - Grok-3
  - xAI
  - 推理增强
  - 大语言模型
  title: 'Grok-3: xAI发布第三代推理增强大语言模型'
new_project:
- desc: 终端内AI结对编程工具，支持多LLM后端（GPT-4o、Claude等），可自动生成并应用Git提交，具备全仓库上下文感知能力，大幅提升重构与调试效率。
  tags:
  - AI编程
  - 结对编程
  - LLM
  - Git
  title: 'Aider: AI驱动的终端结对编程工具'
