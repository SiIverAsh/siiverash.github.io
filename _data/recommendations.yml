paper:
- desc: 顶会论文推荐：ICML 2024 接收，Tri Dao 与 Albert Gu 提出结构化状态空间对偶性（SSD）理论框架，严格证明 Transformer
    注意力机制与状态空间模型是同一数学对象的两种对偶形式。基于此统一视角设计 Mamba-2 架构，在语言建模与长序列任务中实现 2-8 倍训练加速，刷新 300B
    token 规模下 SSM 模型的 perplexity 纪录。
  tags:
  - State Space Model
  - Mamba-2
  - ICML 2024
  - SSD
  title: 'Transformers are SSMs: Generalized Models and Efficient Algorithms Through
    Structured State Space Duality'
  url: https://arxiv.org/abs/2405.21060
tech:
