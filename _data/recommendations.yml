algorithm:
- desc: 经典的监督学习算法，通过寻找最大间隔超平面实现二分类，利用核函数可将线性不可分数据映射到高维空间。SVM在小样本、非线性及高维模式识别中表现优异，是机器学习的重要基石。
  tags:
  - SVM
  - 分类器
  - 核方法
  - 监督学习
  title: 支持向量机 (Support Vector Machine)
cv_recommend:
  agency: Raccoon Dog（原Pro-Fit）
  hometown: 爱知县
  intro: 声线清澈通透，辨识度极高，能自如切换于元气活泼与冷峻沉稳之间，演技细腻且富有层次感，尤其擅长用微妙的气息与语调传递角色心理变化。歌唱实力同样出众，多次举办个人演唱会，现场表现力获广泛赞誉。作为年轻一代声优的代表，其在广播与综艺中的自然亲和力亦为其积累了大量人气，是全能型实力派。
  name: 鬼头明里
date: '2026-07-07'
history:
- event: 卢沟桥事变（七七事变）爆发，中国抗日战争全面开始。
  year: 1937年7月7日
- event: 伦敦地铁与公交车遭受连环恐怖爆炸袭击，造成52人死亡。
  year: 2005年7月7日
- event: 切片面包在密苏里州奇利科西首次上市销售，开启现代食品包装革命。
  year: 1928年7月7日
- event: 美国飞行员肯尼斯·阿诺德报告目击不明飞行物，被认为开启现代UFO时代。
  year: 1947年7月7日
- event: 所罗门群岛脱离英国保护于当日独立，成为英联邦成员。
  year: 1978年7月7日
- event: 新“世界七大奇迹”在葡萄牙里斯本揭晓，万里长城名列榜首。
  year: 2007年7月7日
llm:
- desc: Databricks于2024年3月发布DBRX，采用细粒度专家混合(MoE)架构，总参数132B，推理时激活36B，在编程、数学和通用推理任务上超越GPT-3.5与Llama
    2 70B，支持32K上下文，采用Apache 2.0许可开源。
  tags:
  - MoE
  - 开源
  - 指令微调
  - DBRX
  title: DBRX：132B 参数 MoE 开源大语言模型
new_project:
- desc: UC Berkeley 开源项目，支持在 AWS、Azure、GCP 等任意云上自动选择最优实例运行 LLM 推理与训练任务，成本可降低 3 倍，已集成
    vLLM、DeepSpeed 等后端，GitHub star 8k+。
  tags:
  - 云调度
  - LLM推理
  - 多云
  - GPU
  title: SkyPilot：跨云大模型推理与训练调度框架
  url: https://github.com/skypilot-org/skypilot
paper:
- desc: 顶会论文（ICCV 2023），Google提出将视频生成任务建模为语言模型中的多模态序列预测，通过自回归Transformer统一处理视频、音频、文本等多模态token，实现高保真零样本视频合成与编辑。
  tags:
  - 视频生成
  - 零样本
  - LLM
  - 多模态
  title: 'VideoPoet: A Large Language Model for Zero-Shot Video Generation'
  url: https://arxiv.org/abs/2312.14125
tech:
  Arch:
  - desc: 台积电于2026年Q2启动2nm(N2)风险试产，采用纳米片晶体管(GAA)技术，相较N3E性能提升15%或功耗降低30%，SRAM密度提升至38.5Mb/mm²。预计2026年底为苹果A19与NVIDIA
      Rubin Ultra量产。
    tags:
    - 2nm
    - GAA
    - N2
    - TSMC
    title: TSMC N2 工艺进入风险试产
  Audio:
  - desc: 微软亚洲研究院提出的NaturalSpeech 2，基于连续潜在空间Diffusion模型与音素预处理，仅需3秒参考音频即可克隆任意音色，MOS评分达4.5+，支持中文、英语、日语等多语种。
    tags:
    - 语音合成
    - 零样本
    - Diffusion
    - 多语种
    title: NaturalSpeech 2：零样本语音合成
  CPU:
  - desc: Arrow Lake-S架构，8P+12E共20核，最高睿频5.5GHz，LGA1851接口，首次在桌面平台引入Intel 4工艺与Foveros
      3D封装，PL2功耗250W，搭配Z890主板支持DDR5-6400与PCIe 5.0。
    tags:
    - Arrow Lake
    - 混合架构
    - Intel 4
    - LGA1851
    title: Intel Core Ultra 7 265K 开售
  Computer Vision:
  - desc: 通过大规模伪标签数据训练的Transformer架构，结合ViT与DINOv2特征，在零样本单目深度估计任务上实现SOTA。模型利用半监督学习从无标注图像中提炼几何先验，支持任意分辨率输入，推理延迟仅为20ms。
    tags:
    - 单目深度估计
    - 半监督学习
    - Transformer
    - DINOv2
    title: Depth Anything V2：单目深度估计的新范式
  GPU:
  - desc: 2026年6月，RTX 5060 Ti 搭载Blackwell架构GB207核心，3584 CUDA，8GB GDDR7(128-bit)，TDP
      150W，支持DLSS 4与帧生成，1080p游戏性能接近前代RTX 4070，售价299美元。
    tags:
    - RTX 5060 Ti
    - Blackwell
    - GDDR7
    - 中端市场
    title: NVIDIA GeForce RTX 5060 Ti 正式上市
  Lang:
  - desc: ISO C++委员会在2026年6月夏威夷会议上批准反射(reflection)与执行器(executor)进入C++26工作草案，同时std::simd
      矢量类型与模式匹配语法获初步支持，预计2027年发布正式标准。
    tags:
    - C++26
    - 反射
    - 执行器
    - 标准化
    title: C++26 标准草案：反射与执行器正式入围
  NLP:
  - desc: Anthropic于2026年6月推出Claude 3.5 Haiku，在保持高精度的同时将首token延迟压缩至200ms以内，支持128K上下文窗口，专为实时对话与在线客服场景优化，成本仅为Claude
      3.5 Sonnet的10%。
    tags:
    - 轻量级LLM
    - 快速推理
    - 多语言
    - Anthropic
    title: Claude 3.5 Haiku：轻量级高速推理模型发布
  Net:
  - desc: 2026年6月MWC上海，双方展示6G太赫兹通信原型，采用220GHz频段，实现100Gbps峰值速率与0.1ms空口时延，支持8K全息视频传输与工业数字孪生，预计2030年商用。
    tags:
    - 6G
    - 太赫兹
    - 超高速
    - 原型
    title: 中国电信联合华为发布6G太赫兹原型系统
  News:
  - desc: 2026年6月25日，OpenAI 推出GPT-5，支持文本、图像、音频原生多模态交互，上下文窗口扩展至1M tokens，在MMLU-Pro、HumanEval等基准上全面超越前代，通过API和ChatGPT
      Plus同步上线。
    tags:
    - GPT-5
    - 多模态
    - 长上下文
    - OpenAI
    title: OpenAI 正式发布 GPT-5 多模态模型
