algorithm:
- desc: 经典无监督学习算法，通过迭代最小化样本到簇心的平方误差，将数据划分为K个簇。算法简单高效，广泛应用于客户细分、图像压缩、异常检测等领域。
  tags:
  - 聚类
  - 无监督学习
  - 向量量化
  - 迭代优化
  title: K-Means 聚类
cv_recommend:
  agency: Sony Music Artists
  hometown: 东京都
  intro: 水濑祈以其清澈透明的嗓音和细腻的演技在业内获得高度评价。她能够精准把握角色的情感脉络，无论是活泼开朗的少女还是内心复杂的女性，都能赋予独特魅力。在音乐领域，她凭借稳定的唱功和丰富的表现力成功举办多场个人演唱会，展现出全能艺人的素养。
  name: 水濑祈
date: '2026-07-09'
history:
- event: 阿根廷宣布脱离西班牙独立，成立拉普拉塔联合省。
  year: 1816
- event: 首届温布尔登网球锦标赛在伦敦举行，成为现代网球史上最悠久的赛事。
  year: 1877
- event: 美国国务卿马歇尔在巴黎会议上提出欧洲复兴计划（马歇尔计划），旨在重建战后欧洲经济。
  year: 1947
- event: 罗素-爱因斯坦宣言在伦敦发布，由11位顶尖科学家签署，呼吁和平利用核能并警示核战争危险。
  year: 1955
- event: 旅行者2号探测器以最近距离飞掠木星，传回高分辨率图像并发现木星环。
  year: 1979
- event: 南苏丹共和国正式宣布独立，成为非洲第54个主权国家。
  year: 2011
llm:
- desc: Meta于2025年发布的开源多模态大模型，采用混合专家(MoE)架构，包含Scout与Maverick等版本，支持128K上下文长度，在推理、编码与多模态任务上达到领先水平。
  tags:
  - Llama 4
  - MoE
  - 多模态
  - 开源
  title: Meta Llama 4
new_project:
- desc: 让本地运行大语言模型变得简单易用。支持LLaMA、Mistral等多种模型，提供命令行接口与REST API，一键下载、运行并管理模型，是开发与实验的理想工具。
  tags:
  - Ollama
  - LLM
  - 本地部署
  - CLI
  title: Ollama
  url: https://github.com/ollama/ollama
paper:
- desc: 顶会论文推荐：将偏好对齐与监督微调合并为单一阶段训练，无需额外参考模型，显著降低计算开销并提升对齐效果，为LLM对齐提供高效新范式。
  tags:
  - LLM对齐
  - 单阶段
  - 偏好优化
  - ICLR
  title: 'ORPO: Monolithic Preference Optimization without Reference Model'
  url: https://arxiv.org/abs/2403.07691
tech:
