llm:
- desc: 2026年4月发布，123B参数密集型架构，128K上下文窗口，支持法语、英语、中文等80+语言。在MMLU、HellaSwag等基准上超越Llama-4-70B，函数调用准确率提升40%，原生支持工具使用与代码生成。
  tags:
  - 大语言模型
  - 多语言
  - 开源
  - 推理
  title: 'Mistral Large 3: 123B参数多语言旗舰模型'
new_project:
- desc: vLLM引入PagedAttention机制，实现KV缓存近乎零浪费，内存利用率提升4倍。支持连续批处理、张量并行、量化，兼容HuggingFace模型，广泛应用于生产环境部署。
