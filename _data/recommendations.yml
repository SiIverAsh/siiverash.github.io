  Audio:
  - desc: 微软 NaturalSpeech 3 提出 factorized neural codec，将语音波形分解为内容、韵律、音色和声学细节四个独立子空间，各子空间分别使用不同的
      diffusion 先验建模。在零样本语音克隆场景中，SIM-o 评分达 0.92，MOS 达 4.5，首次在相似度和自然度两个维度上同时超越真实录音基准，且支持细粒度可控的情感与韵律调节。
    tags:
