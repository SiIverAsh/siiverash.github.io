    title: RISC-V 向量扩展 1.0 (RVV 1.0) 正式批准
  Audio:
  - desc: Kyutai实验室于2024年开源的全双工实时语音对话模型。采用联合文本-语音建模，支持低延迟（200ms）自然交互，可同时处理听、说、想，具备情感感知与多轮对话能力。
    tags:
    - 语音合成
    - 实时对话
    - 全双工
    - 开源
    title: 'Moshi: A Speech-Text Foundation Model for Real-Time Dialogue'
  CPU:
