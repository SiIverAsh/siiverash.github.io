  - 推理引擎
  - 大模型
  - 开源
  - PyTorch
  title: 'vLLM: 高吞吐量、内存高效的大模型推理引擎'
  url: https://github.com/vllm-project/vllm
paper:
- desc: ICLR 2026接收论文。提出用前向扩散与逆向生成替代自回归，从头训练8B参数扩散语言模型，在语言理解、数学推理等任务上达到或超越同等规模自回归模型，推理速度提升2倍，支持并行生成。
  tags:
  - 扩散模型
  - 语言模型
  - 非自回归
  - ICLR 2026
  title: 'LLaDA: Large Language Diffusion Models'
  url: https://arxiv.org/abs/2502.09992
