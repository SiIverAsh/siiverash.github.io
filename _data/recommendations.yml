algorithm:
- desc: PCA是一种线性降维算法，通过正交变换将可能相关的变量转换为线性不相关的变量（主成分），保留数据最大方差方向。广泛应用于数据可视化、噪声过滤、特征提取与压缩。核心数学基础为协方差矩阵特征分解或SVD，计算复杂度O(min(n^2p,
    np^2))。
  tags:
  - 降维
  - 特征提取
  - 无监督学习
  - 线性代数
  title: 主成分分析 (Principal Component Analysis)
cv_recommend:
  agency: アイムエンタープライズ (I'm Enterprise)
  hometown: 东京都
  intro: 内田真礼以其清澈活泼的声线与宽泛的角色跨度著称，从元气少女到沉稳御姐均能精准驾驭。她的演出常伴有极具穿透力的情感表达，在业界与粉丝中均享有高度评价。作为アイムエンタープライズ所属声优，其扎实的演技源于对角色背景的深度揣摩，同时她的音乐活动也展现了非凡的唱功，多张单曲打入Oricon榜单。业内普遍认为她的专业素养与稳定的作品质量使其成为平成至令和时代最具代表性的女性声优之一。
  name: 内田真礼
date: '2026-07-03'
history:
- event: 爱达荷州成为美国第43个州。
  year: '1890-07-03'
- event: 约翰·洛吉·贝尔德在伦敦首次展示彩色电视传输。
  year: '1928-07-03'
- event: 以色列突击队救出被劫持到乌干达恩德培机场的法航139航班人质。
  year: '1976-07-03'
- event: 美国巡洋舰文森斯号击落伊朗航空655号航班，290人罹难。
  year: '1988-07-03'
- event: 西班牙同性婚姻合法化法律生效，成为全球第三个承认同性婚姻的国家。
  year: '2005-07-03'
- event: 埃及军方推翻总统穆罕默德·穆尔西，引发全国抗议与政治动荡。
  year: '2013-07-03'
llm:
- desc: Mistral AI发布第二代旗舰模型，123B参数稠密架构，支持128K上下文窗口和数十种语言。在MMLU上达84.0%，HumanEval 92.3%，代码和推理能力显著提升。引入函数调用与JSON模式，API价格低于GPT-4o。权重开放研究用途，商业授权需单独协议。
  tags:
  - 大语言模型
  - Mistral
  - 开源
  - 多语言
  title: Mistral Large 2：123B参数多语言旗舰模型，开源与商业双重许可
new_project:
- desc: GitHub趋势项目：高性能大模型推理引擎。支持PagedAttention实现近乎零浪费的内存管理，连续批处理提升吞吐量。集成量化GPTQ/AWQ，支持Llama、Mistral、Falcon等20+架构。CUDA与x86双后端，可搭配OpenAI兼容API服务器。截至2026年7月Star数超45k。
  tags:
  - LLM推理
  - 高性能
  - 开源
  - Python
  title: vllm-project/vllm
  url: https://github.com/vllm-project/vllm
paper:
- desc: 顶会论文推荐：ICLR 2025口头报告论文。提出视觉自回归建模VAR，将图像生成重新定义为从粗到细的“下一尺度预测”，不同于标准的光栅扫描“下一token预测”。VAR在ImageNet
    256×256上FID达1.80，IS达356.4，推理速度比扩散模型快20倍。代码已开源。
  tags:
  - 图像生成
  - 自回归
  - ICLR
  - 效率
  title: 'Visual Autoregressive Modeling: Scalable Image Generation via Next-Scale
    Prediction'
  url: https://arxiv.org/abs/2404.02905
tech:
  Arch:
  - desc: SiFive P670基于64位RISC-V RVA22+规范，采用12级双发射乱序流水线，最高2.5GHz，SPECINT2k6得分6.77/MHz。支持RISC-V向量扩展1.0(RVV
      1.0)、虚拟化、AIA中断控制器。台积电5nm工艺流片，目标智能座舱和数据中心边缘计算市场，预计2026年Q3量产。
    tags:
    - RISC-V
    - SiFive
    - 处理器架构
    - 向量扩展
    title: SiFive P670：首款RISC-V乱序高性能应用处理器流片
  Audio:
  - desc: 基于潜在扩散模型，支持通过文本提示生成最高3分钟44.1kHz立体声音频。引入音频条件VAE和扩散Transformer(DiT)骨干，实现时间连贯性和结构一致性。新增音频到音频风格迁移功能。在Frechet
      Audio Distance(FAD)指标上较前代提升32%。
    tags:
    - 音频生成
    - 扩散模型
    - 音乐生成
    - 潜空间
    title: Stable Audio 2.0：Stability AI发布长时音乐与音效生成模型
  CPU:
  - desc: Ryzen 9 9950X基于Zen 5架构，16核32线程，最高加速5.7GHz，L3缓存80MB。采用改进的AVX-512完整256位数据路径，IPC较Zen
      4提升16%。支持DDR5-5600和PCIe 5.0，TDP 170W。在Cinebench R23多线程中得分约62,000，超越i9-14900K约18%。2024年8月上市，售价649美元。
    tags:
