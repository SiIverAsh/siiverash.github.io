algorithm:
- desc: 基于梯度提升框架的集成学习算法，引入正则化目标函数与列采样防止过拟合，支持自定义损失函数与分布式训练，在结构化数据竞赛与工业级预测任务中长期占据统治地位。
  tags:
  - 梯度提升
  - 树模型
  - 集成学习
  - XGBoost
  title: 'XGBoost: 极致梯度提升树'
cv_recommend:
  agency: アイムエンタープライズ (I'm Enterprise)
  hometown: 东京都
  intro: 1994年生于东京都，2010年声优出道。隶属于I'm Enterprise事务所。音色清澈富有辨识度，声线跨度极广，可驾驭从活泼少女到冷艳御姐的多元角色。演技细腻自然，在情感爆发戏份中尤显张力。凭借扎实的台词功底与独特的鼻音特质，在同世代声优中独树一帜。曾获第12回声优奖主演女声优奖，是平成年代最具代表性的女性声优之一。
  name: 佐仓绫音
date: '2026-07-08'
history:
- event: 美国费城自由钟敲响，召集市民聆听《独立宣言》首次公开宣读。
  year: '1776'
- event: 美国海军准将佩里率黑船舰队驶入江户湾（今东京湾），迫使日本开国。
  year: '1853'
- event: 《华尔街日报》创刊号正式出版，由道琼斯公司发行。
  year: '1889'
- event: 美国新墨西哥州罗斯威尔陆军机场宣布发现不明飞行物残骸，罗斯威尔事件引发全球UFO热潮。
  year: '1947'
- event: 美国航天飞机亚特兰蒂斯号完成最后一次发射任务，航天飞机时代落幕。
  year: '2011'
- event: 日本前首相安倍晋三在奈良市街头发表演讲时遭枪击身亡。
  year: '2022'
llm:
