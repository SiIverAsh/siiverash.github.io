    title: Intel Core Ultra 5 245K
  Computer Vision:
  - desc: Meta于2024年发布的第二代分割基础模型，支持图像与视频的通用分割。采用Transformer架构与流式记忆机制，实现任意帧的实时交互式与自动分割。模型在多样化数据上训练，具备强大的零样本泛化能力。
    tags:
