algorithm:
- desc: 由 Laurens van der Maaten 与 Geoffrey Hinton 于 2008 年提出的非线性降维算法。核心思想为：在高维空间中以高斯分布度量点对相似性，在低维空间中以
    t 分布（重尾分布）替代，通过最小化两个分布间的 KL 散度实现降维。t 分布有效缓解低维空间中的「拥挤问题」，使 t-SNE 在高维数据（如单细胞 RNA-seq、深度特征）的可视化中表现远优于
    PCA 等线性方法。
  tags:
  - 降维
  - 流形学习
  - 可视化
  - KL散度
  title: t-SNE (t-distributed Stochastic Neighbor Embedding)
cv_recommend:
