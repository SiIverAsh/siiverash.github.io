    title: 'AMD Ryzen 9 9950X: Zen 5 16核旗舰，5nm TSMC，AM5平台'
  Computer Vision:
  - desc: Segment Anything Model 2 (SAM 2) 将可提示分割从图像扩展到视频，采用流式记忆架构，支持实时视频对象分割。模型在多样化SA-V数据集上训练，具备零样本泛化能力，在17个视频数据集上显著超越先前方法，并保持图像分割竞争力。代码与模型权重已开源，Apache
      2.0许可。
    tags:
    - 图像分割
    - 视频理解
    - 基础模型
    - 零样本
    title: SAM 2：Meta发布统一图像与视频可提示分割基础模型
