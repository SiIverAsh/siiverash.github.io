algorithm:
- desc: PCA通过正交变换将可能相关的变量转换为线性不相关的主成分，用于降维与可视化。保留方差最大的方向，广泛应用于高维数据预处理、噪声过滤与特征提取。计算方法为对协方差矩阵进行特征值分解。
  tags:
  - 降维
  - 特征提取
  - 无监督学习
  - 统计学
  title: 主成分分析 (Principal Component Analysis)
cv_recommend:
