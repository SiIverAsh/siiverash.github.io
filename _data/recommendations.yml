  Computer Vision:
  - desc: 状态空间模型（SSM）以线性计算复杂度挑战 Transformer 在视觉任务中的霸权。Vision Mamba、VMamba 等工作将双向 SSM
      与视觉特征层次化建模结合，在 ImageNet-1K 分类任务中以更少 FLOPs 达到 ViT-L 级别精度；同时，Mamba-2 引入结构化状态空间对偶性（SSD），将
      SSM 与注意力机制统一为同一数学框架，在视觉与语言多模态任务上展现出极强的扩展潜力。
    tags:
    - State Space Model
    - Vision Backbone
    - Linear Attention
    - Mamba-2
    title: State Space Models for Vision：Mamba 引领视觉骨干网络新范式
