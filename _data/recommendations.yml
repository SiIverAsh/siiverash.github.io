  intro: 雨宫天是日本女性声优，隶属于Music Ray'n事务所。她以清澈透明且辨识度极高的声线著称，能够驾驭从活泼少女到冷静知性角色的广泛类型，情感表达细腻而富有层次。除了配音工作，她还以歌手身份活跃，发行过多张单曲与专辑，歌唱实力同样受到肯定。在广播节目与活动中展现出开朗亲和的性格，与粉丝互动真诚，积累了大量人气。她对演技不断追求进步的态度，以及在音乐道路上的持续探索，使她成为同世代声优中颇具代表性的存在。
  name: 雨宫天
date: '2026-07-10'
