algorithm:
- desc: 集成学习算法，通过Bootstrap抽样构建多棵决策树，并在分裂时随机选择特征子集。对高维数据鲁棒，自带特征重要性评估。在实际应用中，常作为强基线用于分类、回归及异常检测任务。
  tags:
  - 集成学习
  - 决策树
  - 特征选择
  - 鲁棒性
  title: 随机森林 (Random Forest)
cv_recommend:
  agency: 大泽事务所
  hometown: 东京都
  intro: 花泽香菜以其清澈透明的声线和多样化的演技广受好评。从幼女声线到沉稳角色均能驾驭自如，在业内拥有极高的人气。她不仅在声优领域活跃，还作为歌手举办过个人演唱会，并在综艺节目中展现出率真自然的另一面。对待配音工作极度认真，常根据角色心理变化设计细微的语调调整，这种细腻的表演风格使其成为平成后期至今最具代表性的女性声优之一。
  name: 花泽香菜
date: '2026-07-04'
history:
- event: 大陆会议通过《独立宣言》，美利坚合众国正式成立。
  year: '1776'
- event: 美国第二任总统约翰·亚当斯与第三任总统托马斯·杰斐逊同日逝世，恰好为《独立宣言》发表50周年。
  year: '1826'
- event: 匈牙利物理学家利奥·西拉德申请核连锁反应专利，为核能发展奠定理论基础。
  year: '1934'
- event: NASA的火星探路者号成功着陆火星，释放旅居者号漫游车，开启火星表面巡视探测。
  year: '1997'
- event: NASA深度撞击号探测器释放撞击器成功撞击坦普尔1号彗星，人类首次探测彗星内部结构。
  year: '2005'
- event: 欧洲核子研究中心宣布发现与希格斯玻色子特性一致的新粒子，标准模型拼图基本完成。
  year: '2012'
llm:
- desc: 阿里云发布Qwen 2.5系列，涵盖0.5B至72B参数版本，支持128K上下文。基于优化后的合成数据训练，数学与代码能力大幅提升，中文理解保持SOTA。旗舰模型Qwen2.5-72B在MMLU上得分86.8。
  tags:
  - 多语言
  - 开源
  - 百川
  - 长上下文
  title: 'Qwen 2.5: 通义千问多语言大模型'
new_project:
- desc: 高性能LLM推理框架，纯C/C++实现，无需Python依赖。支持INT4/INT8量化、GPU加速（CUDA/Metal/Vulkan），覆盖桌面、移动端与边缘设备。已集成数百个开源模型，是本地LLM部署的事实标准。
  tags:
  - LLM推理
  - 量化
  - 跨平台
  - C++
  title: llama.cpp
  url: https://github.com/ggerganov/llama.cpp
paper:
- desc: 顶会论文（ICLR 2025 Workshop）：Google DeepMind发布的开源LLM Gemma，基于与Gemini相同的研究与技术栈，提供2B和7B两种尺寸。在同等规模模型中性能领先，训练数据经过严格过滤，附带负责任AI工具包。
  tags:
  - Open Source
  - Gemini
  - 轻量级模型
  - RLHF
  title: 'Gemma: Open Models Based on Gemini Research and Technology'
  url: https://arxiv.org/abs/2403.08295
tech:
  Arch:
  - desc: Compute Express Link 3.1 基于PCIe 6.0物理层，支持全局内存共享与分解式架构。通过多层交换机构建内存池，允许CPU与加速器动态分配内存，实现Tiered
      Memory与近存计算。
    tags:
