llm:
- desc: DeepSeek-V3 采用 671B 总参数、37B 激活参数的 Mixture-of-Experts 架构，引入 Multi-Head Latent
    Attention（MLA）压缩 KV-cache 至传统 MHA 的 5%，支持 128K 上下文窗口。在 MATH-500、HumanEval、MMLU
    等基准上以 1/10 训练成本达到 GPT-4o 水平，完全开源权重并提供 FP8 量化部署方案。
